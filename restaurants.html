<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Restaurants | Foodie Reviews</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Same header/nav as index.html -->

    <main class="container">
        <section class="restaurants">
            <h2>All Restaurants</h2>
            <div class="filter-options">
                <select id="cuisine-filter">
                    <option value="">All Cuisines</option>
                    <option value="italian">Italian</option>
                    <option value="mexican">Mexican</option>
                    <option value="indian">Indian</option>
                    <option value="chinese">Chinese</option>
                    <option value="american">American</option>
                </select>
                <select id="price-filter">
                    <option value="">Any Price</option>
                    <option value="$">$</option>
                    <option value="$$">$$</option>
                    <option value="$$$">$$$</option>
                </select>
            </div>
            <div class="restaurant-list" id="all-restaurants">
                <!-- Filled by JavaScript -->
            </div>
        </section>
    </main>

    <!-- Same footer as index.html -->

    <script src="script.js"></script>
    <script>
        function filterRestaurants() {
            const cuisine = document.getElementById('cuisine-filter').value;
            const price = document.getElementById('price-filter').value;
            const search = document.getElementById('search-input').value.toLowerCase();
            
            const filtered = restaurants.filter(r => {
                return (!cuisine || r.cuisine === cuisine) &&
                       (!price || r.priceRange === price) &&
                       (!search || r.name.toLowerCase().includes(search));
            });
            
            document.getElementById('all-restaurants').innerHTML = 
                filtered.map(createRestaurantCard).join('') || 
                '<p class="no-results">No restaurants found</p>';
        }
        
        function updateRestaurantDisplay() {
            document.getElementById('all-restaurants').innerHTML = 
                restaurants.map(createRestaurantCard).join('');
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            updateRestaurantDisplay();
            document.getElementById('cuisine-filter').addEventListener('change', filterRestaurants);
            document.getElementById('price-filter').addEventListener('change', filterRestaurants);
            document.getElementById('search-input').addEventListener('input', filterRestaurants);
            document.getElementById('search-btn').addEventListener('click', filterRestaurants);
        });
    </script>
</body>
</html>
